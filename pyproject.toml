[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "phenode-gully-scenarios"
version = "0.1.0"
description = "LiDAR incision sensitivity experiments for Phenode and DMM model8"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scipy", "rasterio", "pyproj", "pysheds", "joblib", "matplotlib", "plotly", "requests", "rioxarray"]
[tool.setuptools.packages.find]
where = ["src"]
